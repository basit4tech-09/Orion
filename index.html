<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Orion</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon/android-chrome-512x512.png">
   <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
   <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
   <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
   <link rel="manifest" href="favicon/site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>
</head>

<body class="login-body">
  <!-- LOADER -->
<div class="loader-overlay" id="loader">
  <div class="loader-spinner"></div>
</div>

  <div class="login-wrapper">

    <!-- LOGO -->
    <div class="login-logo">
      Or<span>ion</span>
    </div>

    <!-- CARD -->
    <div class="login-card">
      <div class="login-icon">👋</div>
      <h1>Hey, what's your name?</h1>
      <p>Enter your name to access your personal dashboard</p>

      <form class="login-form" id="login-form">
        <input
          type="text"
          id="name-input"
          placeholder="e.g. Basit"
          maxlength="30"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn-primary">Let Me In →</button>
      </form>

      <p class="login-note">Your data stays on your device. Private & personal.
      <br>⚠️If you clear your browsing history your login details would be deleted also
      </p>
    </div>

    <!-- EXISTING USERS -->
    <div class="saved-users" id="saved-users"></div>

  </div>

  <script src="js/login.js"></script>

</body>
</html>
